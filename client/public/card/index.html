<style>
@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
@font-face { font-family: "Pretendard"; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations"); }
@font-face { font-family: "GmarketSans"; font-style: normal; font-weight: 700; font-display: swap;
  src: url("https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSansBold.woff2") format("woff2"); }
@font-face { font-family: "GmarketSans"; font-style: normal; font-weight: 500; font-display: swap;
  src: url("https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSansMedium.woff2") format("woff2"); }

:root{
  --primary:#3155a4;
  --blue-50:#f4f8ff;
  --blue-100:#e4ecfb;
  --text-body:#33405c;
  --muted-foreground:#7c8aa5;
  --font-sans:"Pretendard","Plus Jakarta Sans",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-display:"GmarketSans","Pretendard",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:linear-gradient(180deg,#16305c 0%,#24467d 62%,#2e5290 100%);
  color:#fff;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
}
a{text-decoration:none}

.screen{
  position:relative;width:100%;max-width:430px;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
}

/* 목걸이 */
.lanyard{
  width:106px;height:54px;flex:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.14) 0 12px,rgba(255,255,255,.05) 12px 24px);
  clip-path:polygon(0 0,100% 0,64% 100%,36% 100%);
  display:flex;justify-content:center;
}
.lanyard span{margin-top:10px;font-family:var(--font-display);font-weight:800;font-size:9px;letter-spacing:.3em;color:rgba(255,255,255,.6)}
.clip{width:38px;height:14px;margin-top:-2px;border-radius:4px;background:linear-gradient(180deg,#dbe4f2,#9fb2cf);flex:none}

/* 카드 */
.card-wrap{
  width:318px;height:486px;margin-top:2px;perspective:1400px;cursor:pointer;flex:none;
  transform-origin:50% -14px;animation:om-sway 6.5s cubic-bezier(.22,1,.36,1) infinite;
  border:none;background:none;padding:0;
}
@keyframes om-sway{0%,100%{transform:rotate(-0.4deg)}50%{transform:rotate(0.4deg)}}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.22,1,.36,1)}
.card-wrap.flipped .card{transform:rotateY(180deg)}
.face{transform:translateZ(0);position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;box-shadow:0 30px 60px rgba(4,20,50,.42);overflow:hidden;display:flex;flex-direction:column}

/* 앞면 */
.front{background:#fff;color:#0f1b33}
.notch{display:flex;justify-content:center;padding:20px 0 0}
.notch i{width:54px;height:8px;border-radius:99px;background:#dfe6f3;box-shadow:inset 0 1px 2px rgba(15,76,169,.25)}
.brandbar{padding:24px 22px 4px;display:flex;align-items:center;justify-content:space-between}
.brandbar .b{display:flex;align-items:center;gap:7px}
.brandbar img{width:22px;height:22px;object-fit:contain}
.brandbar .name{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--primary)}
.eyebrow{font-family:var(--font-display);font-weight:800;font-size:9px;letter-spacing:.22em;color:var(--muted-foreground)}
.who{padding:12px 22px 0;display:flex;gap:16px;align-items:flex-start}
.who img{width:122px;height:176px;flex:none;object-fit:cover;border-radius:12px;background:var(--blue-50)}
.who .info{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.who .n{display:flex;align-items:baseline;gap:7px}
.who .n b{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.05;letter-spacing:-.02em}
.who .n span{font-size:12px;font-weight:700;color:var(--primary)}
.who .en{font-family:var(--font-display);font-weight:800;font-size:10px;letter-spacing:.18em;color:var(--muted-foreground)}
.tel{margin-top:10px;display:flex;flex-direction:column;font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.14;letter-spacing:-.01em;color:var(--primary)}
.svc{padding:16px 22px 0;font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.5;text-align:center;letter-spacing:-.01em;color:var(--text-body)}
.dash{margin:16px 22px 0;border-top:1px dashed var(--blue-100)}
.tags{padding:12px 22px 6px;display:flex;flex-wrap:nowrap;gap:5px}
.tags span{display:inline-flex;align-items:center;justify-content:center;flex:1;height:26px;padding:0 6px;border-radius:999px;background:var(--blue-50);border:1px solid var(--blue-100);color:var(--primary);font-size:11px;font-weight:700;white-space:nowrap}
.cardfoot{margin-top:auto;padding:10px 22px 16px;display:flex;align-items:flex-end;justify-content:space-between}
.hint{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted-foreground)}
.barcode{width:68px;height:68px;flex:none;border-radius:8px;overflow:hidden;background:#fff;padding:3px;border:1px solid var(--blue-100)}
.barcode img{width:100%;height:100%;display:block}

/* 뒷면 */
.back{transform:rotateY(180deg) translateZ(1px);background:#fff;color:#0f1b33;padding:26px 24px;gap:14px}
.back .top{display:flex;align-items:center;justify-content:space-between}
.back .top img{width:28px;height:28px;object-fit:contain}
.back .top .eyebrow{color:var(--muted-foreground)}
.slogan{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.4;letter-spacing:-.01em}
.hr{height:1px;background:var(--blue-100)}
.fields{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field .k{font-family:var(--font-display);font-weight:800;font-size:9px;letter-spacing:.2em;color:var(--muted-foreground)}
.field .v{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.01em;color:#0f1b33}
.links{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.links a{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 16px;border-radius:14px;background:var(--blue-50);border:1px solid var(--blue-100);color:#0f1b33;transition:background .2s}
.links a:hover{background:var(--blue-100)}
.links .t{font-family:var(--font-display);font-weight:700;font-size:15px}
.links .s{font-size:11px;color:var(--muted-foreground)}
.backfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.backfoot .hint{color:var(--muted-foreground)}
.savebtn{backface-visibility:hidden;-webkit-backface-visibility:hidden;display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 16px;border:none;border-radius:999px;background:var(--primary);color:#fff;font-family:var(--font-display);font-weight:700;font-size:13px;cursor:pointer}

/* 하단 고정 버튼 */
.actions{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  width:100%;max-width:430px;margin:0 auto;
  padding:12px 18px calc(18px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--blue-100);display:flex;gap:10px;
}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;height:48px;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:15px;transition:transform .18s,background .2s}
.btn:active{transform:scale(.97)}
.btn-kakao{flex:1;background:var(--primary);color:#fff}
.btn-kakao:hover{background:#FEE500;color:#191919}
.btn-call{width:88px;background:#fff;color:var(--primary);border:1.5px solid var(--blue-100)}
.btn-call:hover{background:var(--blue-50)}

/* ── 데스크톱: 폰 목업 프레임 ── */
@media (min-width:768px){
  body{ background:#0b1730; align-items:center; }
  .frame{
    position:relative; width:402px; height:874px;
    border-radius:54px; border:14px solid #0a1530;
    box-shadow:0 40px 90px rgba(4,12,32,.55);
    overflow:hidden;
    background:linear-gradient(180deg,#16305c 0%,#24467d 62%,#2e5290 100%);
  }
  .screen{ min-height:100%; height:100%; }
  .actions{ position:absolute; left:0; right:0; bottom:0; max-width:none; width:100%; }
}
@media (max-height:760px){
  .lanyard{height:38px}
  .card-wrap{margin-top:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
const wrap = document.getElementById('cardWrap');
wrap.addEventListener('click', e => {
  if (e.target.closest('a') || e.target.closest('#saveContact')) return;
  wrap.classList.toggle('flipped');
});
wrap.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wrap.classList.toggle('flipped'); }
});

document.getElementById('saveContact').addEventListener('click', e => {
  e.stopPropagation();
  const vcard = ["BEGIN:VCARD","VERSION:3.0","N:김;규남;;;","FN:김규남 (이천계단지기)","ORG:이천계단지기","TITLE:대표","TEL;TYPE=CELL:010-8438-1887","EMAIL:rbska3308@naver.com","URL:https://2000stair.kr","END:VCARD"].join("\r\n");
  const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "이천계단지기_김규남.vcf";
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
