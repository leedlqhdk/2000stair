<style>/* ───────────────────────────────────────────────────────────
   이천계단지기 — Color tokens
   Source of truth: client/src/index.css (Cobalt Blue theme, oklch)
   Hue 260 throughout = warm, trustworthy cobalt blue from the logo.
   ─────────────────────────────────────────────────────────── */

:root {
  /* ---- Brand blue ramp (hex, for quick reference / imagery) ---- */
  --blue-50:  #f4f8ff;   /* section wash, chip bg */
  --blue-100: #e4ecfb;   /* hairline borders, rings */
  --blue-200: #c9d8f5;
  --blue-300: #9db8ec;
  --blue-400: #6389dd;
  --blue-500: #3a5dc0;
  --blue-600: #3155a4;   /* brand primary — logo / theme-color */
  --blue-700: #284a8f;
  --blue-800: #213c73;
  --blue-900: #1b2f57;

  /* ---- Core semantic palette (oklch, authoritative) ---- */
  --primary:               oklch(0.45 0.18 260);   /* #2f50a8 cobalt */
  --primary-foreground:    oklch(0.98 0 0);         /* near-white */

  --background:            oklch(1 0 0);            /* #ffffff */
  --foreground:            oklch(0.18 0.02 260);    /* ink, near-black blue */

  --card:                  oklch(1 0 0);
  --card-foreground:       oklch(0.18 0.02 260);

  --popover:               oklch(1 0 0);
  --popover-foreground:    oklch(0.18 0.02 260);

  --secondary:             oklch(0.96 0.02 260);    /* pale blue fill */
  --secondary-foreground:  oklch(0.35 0.12 260);

  --muted:                 oklch(0.96 0.01 260);    /* subtle surface */
  --muted-foreground:      oklch(0.50 0.05 260);    /* slate caption text */

  --accent:                oklch(0.94 0.03 260);
  --accent-foreground:     oklch(0.30 0.14 260);

  --destructive:           oklch(0.577 0.245 27.325); /* warning red */
  --destructive-foreground: oklch(0.985 0 0);

  --border:                oklch(0.92 0.02 260);    /* blue-100 hairline */
  --input:                 oklch(0.92 0.02 260);
  --ring:                  oklch(0.45 0.18 260);    /* = primary */

  /* ---- Data viz (cool, monochromatic blues) ---- */
  --chart-1: oklch(0.55 0.20 260);
  --chart-2: oklch(0.60 0.18 240);
  --chart-3: oklch(0.65 0.15 220);
  --chart-4: oklch(0.70 0.12 200);
  --chart-5: oklch(0.75 0.10 280);

  /* ---- Sidebar / dashboard surfaces ---- */
  --sidebar:                    oklch(0.98 0.005 260);
  --sidebar-foreground:         oklch(0.18 0.02 260);
  --sidebar-primary:            oklch(0.45 0.18 260);
  --sidebar-primary-foreground: oklch(0.98 0 0);
  --sidebar-accent:             oklch(0.94 0.03 260);
  --sidebar-accent-foreground:  oklch(0.30 0.14 260);
  --sidebar-border:             oklch(0.92 0.02 260);
  --sidebar-ring:               oklch(0.45 0.18 260);

  /* ---- Convenience aliases (plain-English names) ---- */
  --text-strong:   var(--foreground);
  --text-body:     oklch(0.30 0.03 260);   /* gray-700 body copy */
  --text-muted:    var(--muted-foreground);
  --surface-page:  var(--background);
  --surface-card:  var(--card);
  --surface-wash:  var(--blue-50);         /* tinted section bg */
  --footer-bg:     var(--blue-900);        /* deep navy footer (진한 네이비) */
}

/* Dark theme (carried from the source app; used by dashboard) */
.dark {
  --primary:               oklch(0.60 0.20 260);
  --primary-foreground:    oklch(0.98 0 0);
  --background:            oklch(0.14 0.02 260);

  --card:                  oklch(0.18 0.02 260);
  --card-foreground:       oklch(0.92 0.01 260);
  --popover:               oklch(0.18 0.02 260);
  --popover-foreground:    oklch(0.92 0.01 260);
  --secondary:             oklch(0.22 0.03 260);
  --secondary-foreground:  oklch(0.80 0.05 260);
  --muted:                 oklch(0.25 0.03 260);

  --border:                oklch(0.30 0.03 260);
  --input:                 oklch(0.30 0.03 260);
  --ring:                  oklch(0.60 0.20 260);
}

<style>/* ───────────────────────────────────────────────────────────
   이천계단지기 — Typography tokens
   Korean copy → Pretendard · Latin & numerals → Plus Jakarta Sans
   The brand leans HEAVY: display headings are 800 (extrabold),
   labels 700, body 500–600. Eyebrows are tracked-out uppercase.
   ─────────────────────────────────────────────────────────── */

:root {
  /* ---- Families ---- */
  --font-sans: "Pretendard", "Plus Jakarta Sans", system-ui, -apple-system,
               "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-display: "GmarketSans", "Pretendard", system-ui, sans-serif; /* headings, titles, prices */
  --font-latin: "Plus Jakarta Sans", "Pretendard", system-ui, sans-serif;
  --font-eyebrow: "Plus Jakarta Sans", "Pretendard", system-ui, sans-serif;

  /* ---- Weights ---- */
  --weight-regular:  400;
  --weight-medium:   500;
  --weight-semibold: 600;
  --weight-bold:     700;
  --weight-extrabold: 800;

  /* ---- Type scale (px) ---- */
  --text-display:  4.5rem;   /* 72 — hero h1 (clamps down on mobile) */
  --text-h1:       3rem;     /* 48 */
  --text-h2:       2.25rem;  /* 36 — section titles */
  --text-h3:       1.5rem;   /* 24 — card titles */
  --text-h4:       1.25rem;  /* 20 */
  --text-lg:       1.125rem; /* 18 — lead paragraph */
  --text-base:     1rem;     /* 16 — body */
  --text-sm:       0.875rem; /* 14 — secondary / nav */
  --text-xs:       0.75rem;  /* 12 — captions, eyebrow */

  /* ---- Line heights ---- */
  --leading-tight:   1.08;   /* display headings */
  --leading-snug:    1.18;   /* h2 / h3 */
  --leading-normal:  1.5;
  --leading-relaxed: 1.65;   /* body copy */

  /* ---- Letter spacing ---- */
  --tracking-display:  0.045em;  /* headlines breathe slightly */
  --tracking-tight:   -0.01em;   /* price / numerals */
  --tracking-normal:   0;
  --tracking-eyebrow:  0.28em;   /* PROCESS / MAP labels */
  --tracking-eyebrow-sm: 0.16em;
}
</style>
<style>/* ───────────────────────────────────────────────────────────
   이천계단지기 — Spacing, radius, elevation
   Base radius 0.75rem. Cards round generously (xl → 2xl).
   Elevation is BLUE-TINTED, never neutral grey — shadows carry
   a cobalt cast (rgba(15,76,169,…)) so cards feel part of the brand.
   ─────────────────────────────────────────────────────────── */

:root {
  /* ---- Spacing scale (4px base) ---- */
  --space-1:  0.25rem;  /*  4 */
  --space-2:  0.5rem;   /*  8 */
  --space-3:  0.75rem;  /* 12 */
  --space-4:  1rem;     /* 16 */
  --space-5:  1.25rem;  /* 20 */
  --space-6:  1.5rem;   /* 24 — card padding (sm) */
  --space-8:  2rem;     /* 32 — card padding (lg) */
  --space-10: 2.5rem;   /* 40 */
  --space-12: 3rem;     /* 48 */
  --space-16: 4rem;     /* 64 — section padding (mobile) */
  --space-20: 5rem;     /* 80 */
  --space-28: 7rem;     /* 112 — section padding (desktop) */

  /* ---- Radius ---- */
  --radius:    0.75rem;                    /* 12 — base */
  --radius-sm: calc(var(--radius) - 4px);  /*  8 */
  --radius-md: calc(var(--radius) - 2px);  /* 10 */
  --radius-lg: var(--radius);              /* 12 — inputs, buttons-lg */
  --radius-xl: calc(var(--radius) + 4px);  /* 16 — cards */
  --radius-2xl: 1.25rem;                   /* 20 — dropdowns, nav panels */
  --radius-card: 1.6rem;                   /* 25.6 — pricing / feature cards */
  --radius-pill: 9999px;                   /* chips, CTAs, avatars */

  /* ---- Elevation (cobalt-tinted) ---- */
  --shadow-xs:   0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow-sm:   0 4px 12px rgba(15, 23, 42, 0.08);
  --shadow-md:   0 8px 18px rgba(15, 23, 42, 0.12);
  --shadow-card: 0 16px 42px rgba(15, 76, 169, 0.08);   /* resting card */
  --shadow-card-hover: 0 20px 48px rgba(0, 81, 199, 0.12); /* lifted card */
  --shadow-dropdown: 0 18px 40px rgba(8, 18, 48, 0.10);
  --shadow-footer: 0 16px 36px rgba(0, 0, 0, 0.18);

  /* ---- Layout ---- */
  --container-max: 1280px;
  --container-pad: 1rem;     /* 2rem at lg */

  /* ---- Motion ---- */
  --ease-out-brand: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --dur-fast:   200ms; /* @kind other */
  --dur-base:   300ms; /* @kind other */
  --dur-slow:   550ms; /* @kind other */
  --hover-lift: -2px; /* @kind other */
}
</style>
